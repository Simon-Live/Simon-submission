<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta property="og:image" content="icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>Simon</title>
<!-- Inter loads from theme/fonts.css off the render path, as on index.html; the files are served from this site -->
<link rel="preload" as="image" href="media/landing-poster.jpg">
<link rel="stylesheet" href="theme/fonts.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="theme/fonts.css"></noscript>
<link rel="stylesheet" href="theme/tokens.css">
<link rel="stylesheet" href="theme/landing.css">
</head>
<body class="landing">
<main class="ld">
  <video class="ld-clip" data-testid="landing-loop" src="media/landing-loop.mp4" poster="media/landing-poster.jpg"
    muted loop playsinline preload="auto" aria-label="A Simon result: a squat with the faults marked"></video>
  <!-- LEG-M8, WCAG 2.2.2: landing.js plays the silent loop unless reduced motion is asked for, and this button pauses it -->
  <button type="button" class="ld-pause" data-testid="landing-pause" aria-pressed="false" hidden>Pause the clip</button>
  <h1 class="ld-line" data-testid="landing-line">Copy a move. See where you drifted.</h1>
  <a class="ld-try" data-testid="landing-try" href="./#/">Try it</a>
</main>
<script type="module" src="landing.js"></script>
</body>
</html>
