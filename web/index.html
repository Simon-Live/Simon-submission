<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Simon</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<!-- brand theme: tokens first (the only file with literal colors), then components and screens on those tokens -->
<link rel="stylesheet" href="theme/fonts.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="theme/fonts.css"></noscript>
<link rel="stylesheet" href="theme/tokens.css">
<link rel="stylesheet" href="theme/base.css">
<link rel="stylesheet" href="theme/library.css">
<link rel="stylesheet" href="theme/results.css">
<link rel="stylesheet" href="theme/screens.css">
<link rel="stylesheet" href="theme/loader.css">
<script type="importmap">
{"imports": {"three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/"}}
</script>
</head>
<body>
<header class="bar">
  <a class="brand" href="#/" data-testid="home-link"><span class="brand-word">simon</span></a>
  <div id="kind-switch"></div>
  <nav class="bar-nav" aria-label="Main"><a href="#/record" data-testid="nav-record">Record</a></nav>
  <div id="build" class="build" role="group" aria-label="Build" hidden></div>
</header>
<main id="app" tabindex="-1" aria-live="polite">
  <!-- shown until the app's first screen replaces it (views/paw-loader.js draws the same trail later) -->
  <div class="paw-loading boot" data-testid="boot-loading"><span class="paw-trail" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="paw-loading-text" role="status">Fetching Simon</span></div>
</main>
<noscript><p class="notice">Simon needs JavaScript. Turn it on and reload.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
