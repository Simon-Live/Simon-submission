[project]
name = "part5"
version = "0.1.0"
description = "Simon Part 5: compare 3D animations and analyse faults"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
part5 = "part5.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.18",
    "hypothesis>=6.168.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["part5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
