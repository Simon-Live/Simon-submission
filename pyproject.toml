[project]
name = "simon-part-7"
version = "0.1.0"
description = "Simon Part 7: stitching Parts 1 to 6 into one phone app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
part7 = "part7.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["part7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
