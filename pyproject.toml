[project]
name = "simon-part-7"
version = "0.1.0"
description = "Simon Part 7: stitching Parts 1 to 6 into one phone app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "idna>=3.20",
]

[project.scripts]
part7 = "part7.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["part7"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["modules", "videos"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are re-declared as arguments, and a few tests import after setup
"tests/**" = ["F811", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
