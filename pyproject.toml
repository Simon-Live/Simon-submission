[project]
name = "simon-part2"
version = "0.1.0"
description = "Simon Part 2: video frames to per-person 3D poses (pose3d.json) and tracks (tracks.json)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg>=0.5",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.0",
    "pillow>=13.0.0",
]

[project.scripts]
part2 = "part2.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["part2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
