<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simon Part 4 — expected movement</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #171614;
    --panel: #221f1b;
    --ink: #f3efe6;
    --muted: #a39b8d;
    --line: #3a342c;
    --left: #8eb7ff;
    --right: #e2a15a;
    --mid: #f3efe6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 "Iowan Old Style", Palatino, "Palatino Linotype", serif;
  }
  header, footer {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  p { margin: 0; color: var(--muted); }
  main { padding: 0 20px 12px; }
  canvas {
    width: 100%;
    height: min(72vh, 760px);
    background: #12110f;
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: grab;
    display: block;
    touch-action: none;
  }
  canvas:active { cursor: grabbing; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button, select {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    font: inherit;
  }
  button { cursor: pointer; }
  input[type="range"] { width: min(280px, 40vw); accent-color: #c9843a; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  #status { min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Expected movement</h1>
    <p id="subtitle">Hip-centered skeleton, 30 fps. Drag to orbit, scroll to zoom.</p>
  </div>
  <div class="controls">
    <label>Clip <select id="set">
      <option value="exercise">exercise — squat</option>
      <option value="dance">dance — step touch</option>
    </select></label>
    <button id="play" type="button">Play</button>
    <button id="step" type="button">Step</button>
  </div>
</header>
<main>
  <canvas id="view" width="1200" height="720"></canvas>
  <div class="controls" style="margin-top:12px">
    <input id="scrub" type="range" min="0" max="1" value="0" aria-label="Frame" />
    <p id="status">Loading…</p>
  </div>
</main>
<footer>
  <p><span class="swatch" style="background:#8eb7ff"></span>subject left
     <span class="swatch" style="background:#e2a15a;margin-left:14px"></span>subject right
     <span class="swatch" style="background:#f3efe6;margin-left:14px"></span>midline</p>
  <p>Serve from the repo root: <code>python3 -m http.server 8765</code> then open <code>/demo/</code>.</p>
</footer>
<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const setSelect = document.getElementById("set");
const playBtn = document.getElementById("play");
const stepBtn = document.getElementById("step");
const scrub = document.getElementById("scrub");
const status = document.getElementById("status");

let clip = null;
let frame = 0;
let playing = false;
let lastTick = 0;
let yaw = 0.55;
let pitch = 0.28;
let dist = 2.4;
const target = [0, -0.02, 0];

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  draw();
}
window.addEventListener("resize", resize);

function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function norm(a) {
  const n = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / n, a[1] / n, a[2] / n];
}
function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2]; }

function project(p) {
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const eye = add(target, [dist * cp * sy, dist * sp, dist * cp * cy]);
  const forward = norm(sub(target, eye));
  let right = cross(forward, [0, 1, 0]);
  if (Math.hypot(...right) < 1e-6) right = [1, 0, 0];
  right = norm(right);
  const up = cross(right, forward);
  const rel = sub(p, eye);
  const x = dot(rel, right);
  const y = dot(rel, up);
  const z = dot(rel, forward);
  const f = (canvas.height * 0.85) / Math.max(0.2, z);
  return [canvas.width / 2 + x * f, canvas.height / 2 - y * f, z];
}

function sideColor(name) {
  if (name.startsWith("left_")) return "#8eb7ff";
  if (name.startsWith("right_")) return "#e2a15a";
  return "#f3efe6";
}

function posePoints(joints) {
  const pts = {};
  for (const [name, xyz] of Object.entries(joints)) pts[name] = xyz;
  pts.hip_mid = mid(joints.left_hip, joints.right_hip);
  pts.shoulder_mid = mid(joints.left_shoulder, joints.right_shoulder);
  return pts;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#12110f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawAxes();
  if (!clip) return;
  const index = Math.floor(frame) % clip.frame_count;
  const sample = clip.frames[index];
  const pts = posePoints(sample.joints);
  const bones = clip.bones.slice();
  bones.push({ parent: "shoulder_mid", child: "nose", name: "neck" });
  const segs = bones.map((bone) => {
    const a = project(pts[bone.parent]);
    const b = project(pts[bone.child]);
    return { a, b, z: (a[2] + b[2]) / 2, bone };
  }).sort((u, v) => u.z - v.z);
  ctx.lineWidth = Math.max(2, canvas.height / 280);
  ctx.lineCap = "round";
  for (const seg of segs) {
    ctx.strokeStyle = "#d9d0c1";
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(seg.a[0], seg.a[1]);
    ctx.lineTo(seg.b[0], seg.b[1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const dots = Object.entries(pts).filter(([name]) => clip.joints.includes(name));
  dots.sort((u, v) => project(u[1])[2] - project(v[1])[2]);
  for (const [name, xyz] of dots) {
    const p = project(xyz);
    ctx.fillStyle = sideColor(name);
    ctx.beginPath();
    ctx.arc(p[0], p[1], Math.max(3.5, canvas.height / 180), 0, Math.PI * 2);
    ctx.fill();
  }
  const t = sample.t.toFixed(2);
  const kind = sample.interpolated ? "interpolated" : "keyframe";
  status.textContent = `${clip.movement} · frame ${sample.index} / ${clip.frame_count - 1} · ${t}s · ${kind}`;
  scrub.max = String(clip.frame_count - 1);
  scrub.value = String(index);
}

function drawAxes() {
  const origin = project([0, 0, 0]);
  const axes = [
    [[0.28, 0, 0], "#8eb7ff", "left"],
    [[0, 0.28, 0], "#d7d2c6", "up"],
    [[0, 0, 0.28], "#e2a15a", "anterior"],
  ];
  ctx.lineWidth = 1.5;
  ctx.font = `${Math.max(12, canvas.height / 48)}px Palatino, serif`;
  for (const [tip, color, label] of axes) {
    const p = project(tip);
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(origin[0], origin[1]);
    ctx.lineTo(p[0], p[1]);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    ctx.fillText(label, p[0] + 6, p[1]);
  }
}

async function loadSet(name) {
  playing = false;
  playBtn.textContent = "Play";
  status.textContent = "Loading " + name + "…";
  const response = await fetch(`../fixtures/output/${name}/animation.json`);
  if (!response.ok) throw new Error("HTTP " + response.status);
  clip = await response.json();
  frame = 0;
  draw();
}

function tick(now) {
  if (playing && clip) {
    const dt = lastTick ? (now - lastTick) / 1000 : 0;
    lastTick = now;
    const advance = dt * clip.fps;
    frame = (frame + advance) % clip.frame_count;
    draw();
  } else {
    lastTick = now;
  }
  requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
});
stepBtn.addEventListener("click", () => {
  if (!clip) return;
  playing = false;
  playBtn.textContent = "Play";
  frame = (Math.floor(frame) + 1) % clip.frame_count;
  draw();
});
scrub.addEventListener("input", () => {
  playing = false;
  playBtn.textContent = "Play";
  frame = Number(scrub.value);
  draw();
});
setSelect.addEventListener("change", () => {
  loadSet(setSelect.value).catch((error) => {
    status.textContent = "Could not load the clip (" + error.message + "). Serve the repo root over HTTP.";
  });
});
canvas.addEventListener("pointerdown", (event) => {
  canvas.setPointerCapture(event.pointerId);
  canvas.dataset.dragX = String(event.clientX);
  canvas.dataset.dragY = String(event.clientY);
});
canvas.addEventListener("pointermove", (event) => {
  if (!canvas.hasPointerCapture(event.pointerId)) return;
  const x = Number(canvas.dataset.dragX);
  const y = Number(canvas.dataset.dragY);
  yaw -= (event.clientX - x) * 0.008;
  pitch = Math.max(-1.15, Math.min(1.15, pitch + (event.clientY - y) * 0.006));
  canvas.dataset.dragX = String(event.clientX);
  canvas.dataset.dragY = String(event.clientY);
  draw();
});
canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  dist = Math.max(0.8, Math.min(6, dist * (event.deltaY > 0 ? 1.08 : 0.92)));
  draw();
}, { passive: false });
window.addEventListener("keydown", (event) => {
  if (event.code === "Space") {
    event.preventDefault();
    playBtn.click();
  }
});

resize();
loadSet("exercise").catch((error) => {
  status.textContent = "Could not load the clip (" + error.message + "). From the repo root run: python3 -m http.server 8765";
});
requestAnimationFrame(tick);
</script>
</body>
</html>
