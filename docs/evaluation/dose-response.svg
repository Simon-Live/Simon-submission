<title id="chart-title">Faults first fire at 7.5 to 20 degrees of planted error</title>
<desc id="chart-desc">Mean score against planted joint-angle error. knee: first fires at 10 degrees; mean score 100 at 0 degrees, 93.2 at 10 degrees, 78.8 at 20 degrees, 73.3 at 30 degrees. hip: first fires at 7.5 degrees; mean score 100 at 0 degrees, 85.8 at 10 degrees, 78.3 at 20 degrees, 67.8 at 30 degrees. elbow: first fires at 20 degrees; mean score 100 at 0 degrees, 100 at 10 degrees, 92.5 at 20 degrees, 85.8 at 30 degrees. trunk: first fires at 10 degrees; mean score 100 at 0 degrees, 87.2 at 10 degrees, 81.8 at 20 degrees, 77.2 at 30 degrees.</desc>
