<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>result harness</title>
<link rel="stylesheet" href="../../../web/theme/tokens.css">
<link rel="stylesheet" href="../../../web/theme/base.css">
<link rel="stylesheet" href="../../../web/theme/voice.css">
<style>html,body{margin:0;background:#0c1118}</style>
<div id="app"></div>
<script type="module">
import { mountResult, mountViewer } from "../../../web/result.js";
const q = new URLSearchParams(location.search);
let [analysis, replay] = await Promise.all(
  ["analysis-1.2.0.json", "replay.json"].map((f) => fetch(`../../../fixtures/input/${f}`).then((r) => r.json())),
);
const c = q.get("case") || "ok";
const fixture = (f) => fetch(`../../../fixtures/input/${f}`).then((r) => r.json());
// Part 5 1.5.0 on the real fast lateral raise: insights, cues and a tempo cue per rep. That take has no replay
// fixture, so the harness replay is played four times over (12.8 s) to cover the take's 10.5 s and give the
// insights a compare to seek.
if (c === "insights") {
  analysis = await fixture("analysis-insights.json");
  const reps = 4, nF = replay.follower.length, span = nF / replay.fps;
  const tile = (track) => Array.from({ length: reps }, () => structuredClone(track)).flat();
  const times = (ts) => Array.from({ length: reps }, (_, k) => ts.map((t) => +(t + k * span).toFixed(6))).flat();
  replay = { ...replay, expected: tile(replay.expected), follower: tile(replay.follower),
    expected_t: times(replay.expected_t), follower_t: times(replay.follower_t),
    exp_to_fol: Array.from({ length: reps }, (_, k) => replay.exp_to_fol.map((f) => f + k * nF)).flat() };
}
// Part 5's 1.5.0 golden example: two faults with cues and joints, the insights that point at them
// release 14: the insights take where the elbow fault was worded live by Muse Spark and the hands fault from fixed text
if (c === "insights-live" || c === "insights-live-es" || c === "insights-live-tmplwhy") {
  analysis = await fixture("analysis-insights.json");
  analysis.faults = [
    { measure: "elbow_flexion", side: "right", at_s: 5.8, cue: "Straighten your right arm more", text: "right elbow bent", joints: ["right_elbow"] },
    { measure: "forearm_out", side: "both", at_s: 5.8, cue: "Move your hands out wider", text: "hands too close in", joints: ["left_wrist", "right_wrist"] },
  ];
  analysis.phrasing = { ...analysis.phrasing, backend: "muse-spark", faults: [
    { backend: "muse-spark", model: "muse-spark-open", fallback_reason: null, text: "Your right elbow bends far more than the trainer's." },
    { backend: "template", model: null, fallback_reason: null, text: "hands too close in" },
  ] };
}
if (c === "insights-live" || c === "insights-live-es" || c === "insights-live-tmplwhy") {   // R14b: Part 5's retimed why, with its rep count, on the model-worded row
  analysis.insights.forEach((x) => { if (x.cue === "Straighten your right arm more") x.why = "Your right elbow bends far more than the trainer's at 5.8 s (5 of 5 reps)"; });
}
if (c === "insights-live-tmplwhy") {   // R15: Part 5 had no live clause for the why, so it holds template words
  analysis.insights.forEach((x) => { if (x.cue === "Straighten your right arm more") x.why = "Right elbow bent more than the example at 5.8 s"; });
}
if (c === "insights-live-es") {   // R14b: the lines are in Spanish: the list says so, the row shows Part 5's own words, no label on fixed text
  analysis.phrasing.lang = "es";
  analysis.phrasing.faults.forEach((f) => { f.lang = "es"; });
}
// R16: a real j7 take as Part 5 wrote it: every rep row holds its fault's live sentence verbatim
if (c === "real" || c === "real-es" || c === "real-dance" || c === "real-mixed") {
  analysis = await fixture("analysis-real-j7.json");
  const same = (m, f) => f.measure === m.measure && f.side === m.side && f.cue === m.cue;
  const tl = analysis.score.timeline;
  if (c === "real-es") {   // a translated live line: phrasing.lang es, and Part 5 copies the translated sentence onto the rep row
    analysis.phrasing.lang = "es";
    analysis.phrasing.faults.forEach((f, i) => { f.lang = "es"; f.text = `Linea en espanol ${i + 1}, a los ${analysis.faults[i].at_s} s.`; });
  }
  if (c === "real-mixed") analysis.phrasing.faults[1] = { backend: "template", model: null, fallback_reason: "live phrasing timed out", text: analysis.faults[1].text_timed };
  for (const w of tl) for (const m of w.misses) {
    const i = analysis.faults.findIndex((f) => same(m, f));
    if (i >= 0 && c !== "real") m.text = analysis.phrasing.faults[i].text;   // real: kept exactly as Part 5 wrote it
  }
}
if (c === "insights-golden") analysis = await fixture("analysis-1.5.0.json");
if (c === "refused" || c === "noreplay") {
  analysis.score = null; analysis.faults = [];
  analysis.status = { code: "different_movement", text: "This looks like a different movement from the one you were asked to copy." };
}
if (c === "oldrefusal") { // the current pin: exit 3, status refusal, no score, no faults
  analysis.score = null; analysis.faults = [];
  analysis.status = { code: "not_enough_visible", text: "Only your upper body was in view." };
}
if (c === "partial") { // schema 1.4.0: status ok, warnings, low-confidence faults, a score capped at 59
  analysis.warnings = [{ code: "moving_part_out_of_frame", text: "Your legs were out of frame." }, { code: "low_match", text: "Low match with the trainer." }];
  analysis.match = { quality: "low", residual: 0.4, timing_corr: 0.2, limits: {} };
  analysis.faults.forEach((f) => { f.confidence = "low"; });
  analysis.score = { ...analysis.score, value: 41, grade: "F", capped_by: ["moving_part_out_of_frame", "low_match"] };
}
// Part 5 1.8.0: diagnostics.near_misses (TICKET-100); "nearmiss-empty" lists none; the plain 1.2.0 cases have no field
if (c === "nearmiss" || c === "nearmiss-empty") {
  analysis = await fixture("analysis-near-misses.json");
  if (c === "nearmiss-empty") analysis.diagnostics.near_misses = { total: 0, omitted: 0, items: [] };
}
// TICKET-155: staging job 02e783ae6e63, one fault, its window 73 C, capped to 59 F by low_match
if (c === "capped") analysis = await fixture("analysis-capped-low-match.json");
// staging job 652b525a73ee (the judge hero): one part at 100 A, capped to 59 F by low_match, no faults, no insights
if (c === "low-match-hero") analysis = await fixture("analysis-low-match-hero.json");
// Part 5's credit score (simon.credit.v1, score.credit) on the 8-rep lateral raise: the "% or points" switch shows;
// "credit-null" is a take where nothing was compared (credit null): the switch hides and score.value shows as before
if (c === "credit" || c === "credit-null") analysis = await fixture("analysis-credit.json");
if (c === "credit-null") analysis.score.credit = null;
// one-letter.md: the MM-Fit take 42a02415127e's score block (37 F, credit 16,239 of 22,367, C), uncapped and capped
if (c === "one-letter" || c === "one-letter-capped") {
  const cases = (await fetch("../fixtures/shown-score-vectors.json").then((r) => r.json())).cases;
  analysis = await fixture("analysis-credit.json");
  analysis.score = { ...analysis.score, ...cases[c === "one-letter" ? 0 : 4].analysis.score };
  if (c === "one-letter-capped") analysis.warnings = [{ code: "low_match", text: "This take does not closely match the trainer's movement." }];
}
if (c === "nofaults") analysis.faults = [];
if (c === "fallback") analysis.phrasing.faults[1] = { backend: "template", model: null, fallback_reason: "live phrasing timed out" };
// TICKET-116: the trainer's Part 3 unseen mark (part7/trainer_visibility.py over a seated or a standing skeleton sample)
const trainerVisibility = c === "trainer-seated" || c === "trainer-standing"
  ? await fixture(`trainer-visibility-${c.slice(8)}.json`) : null;
const root = document.getElementById("app");
// TICKET-065: the replay's trainer track written as a Part 4 animation.json (virtual-joint spine, no torso sides)
const part4Bones = [["left_hip", "right_hip"], ["hip_mid", "shoulder_mid"], ["left_shoulder", "right_shoulder"], ["left_hip", "left_knee"],
  ["left_knee", "left_ankle"], ["right_hip", "right_knee"], ["right_knee", "right_ankle"], ["left_shoulder", "left_elbow"], ["left_elbow", "left_wrist"],
  ["right_shoulder", "right_elbow"], ["right_elbow", "right_wrist"], ["nose", "left_eye"], ["nose", "right_eye"], ["left_eye", "left_ear"], ["right_eye", "right_ear"]];
const animation = () => ({ format: "simon.animation.v1", fps: replay.fps, joints: replay.joints,
  bones: part4Bones.map(([parent, child]) => ({ name: parent + "-" + child, parent, child })),
  frames: replay.expected.map((f, i) => ({ index: i, t: i / replay.fps, joints: Object.fromEntries(replay.joints.map((n, j) => [n, f[j]]).filter(([, p]) => p)) })) });
const wrist = replay.joints.indexOf("left_wrist");
const hideWrist = (track) => track.forEach((f, i) => { if (i) f[wrist] = null; }); // unseen after frame 0
if (c === "unseen") { hideWrist(replay.expected); hideWrist(replay.follower); }
if (c === "animation-unseen") hideWrist(replay.expected);
if (c === "viewer") window.__r = await mountViewer(root, { replay });
else if (c === "animation-sim1") window.__r = await mountViewer(root, { animation: await fetch("../fixtures/input/animation-squat-sample.json").then((r) => r.json()) }); // TICKET-090
else if (c === "animation" || c === "animation-unseen") window.__r = await mountViewer(root, { animation: animation() });
else if (c === "orphan" || c === "orphan-present") { // TICKET-331: a fake follow take; "orphan" has its movement deleted, "orphan-present" does not
  const JOB = "e700387c7a1c", ENTRY = "knee-raise-harness-b6635964";
  window.__req = [];
  const real = window.fetch.bind(window);
  const json = (status, body) => new Response(JSON.stringify(body), { status, headers: { "content-type": "application/json" } });
  window.fetch = async (url, opts) => {
    const u = String(url);
    if (u.endsWith("api/auth/me")) return json(200, { available: true, signed_in: true, user_id: "u-1" });
    if (u.endsWith(`api/jobs/${JOB}`)) return json(200, { id: JOB, kind: "follow", status: "done", entry_id: ENTRY, entry_gone: c === "orphan", narration: true, attribution: { mine: true } });
    if (u.includes("catalog/api/entries/") || u.includes("ask-trainer") || u.includes("ask-take") || u.includes("since-last-time") || u.includes("api/me/history/") || u.includes("api/narration/")) {
      window.__req.push(u);
      return json(c === "orphan" ? 404 : 200, c === "orphan" ? { error: "gone" } : { name: "Knee raise", video_uri: "video.mp4", can_ask: false, takes: [] });
    }
    if (u.endsWith("/analysis.json") && u.includes(JOB)) return json(200, analysis);
    if (u.endsWith("/replay.json") && u.includes(JOB)) return json(200, replay);
    if (u.endsWith("/trainer-visibility.json") && u.includes(JOB)) return json(200, null);
    if (u.includes("api/me/")) return json(200, {});
    return real(url, opts);
  };
  const { loadResultFor } = await import("../../../web/orphan-load.js");
  const loadResult = async () => ({ analysis, replay, trainerVisibility: null, trainerVideoUrl: "../fixtures/coach.webm",
    record: { id: JOB, kind: "follow", entry_id: ENTRY, entry_gone: false, narration: true, attribution: { mine: true } } });
  const data = await loadResultFor(JOB, null, loadResult);
  window.__r = await mountResult(root, { analysis: data.analysis, replay: data.replay, trainerVisibility: data.trainerVisibility, trainerVideoUrl: data.trainerVideoUrl, record: data.record, job: JOB, videoUrl: "../fixtures/coach.webm" });
}
else window.__r = await mountResult(root, { analysis, trainerVisibility, replay: c === "badreplay" ? { fps: 0 } : c === "noreplay" ? undefined : replay, record: c === "real-dance" ? { mode: "dance" } : undefined });
window.__ready = true;
</script>
