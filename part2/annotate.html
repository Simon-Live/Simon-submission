<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simon Part 2 — labelling</title>
<style>
  :root { color-scheme: light dark; --accent: #2f6fdb; --ok: #2e9e5b; --muted: #888; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; display: flex; height: 100vh; }
  #stage { flex: 1; position: relative; background: #111; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #panel { width: 300px; padding: 12px; overflow-y: auto; border-left: 1px solid #8884; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  button { font: inherit; padding: 3px 8px; }
  ul { list-style: none; padding: 0; margin: 6px 0; }
  li { padding: 2px 6px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; }
  li.cur { outline: 2px solid var(--accent); }
  .set { color: var(--ok); } .skip { color: var(--muted); text-decoration: line-through; } .hint { color: #d9a400; }
  #status { margin-top: 8px; color: var(--muted); min-height: 1.4em; }
  #status.err { color: #d33; }
  kbd { border: 1px solid #8886; border-radius: 3px; padding: 0 4px; font-size: 12px; }
  .keys { color: var(--muted); font-size: 12px; margin-top: 10px; }
  input[type=number] { width: 70px; font: inherit; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="panel">
  <h1 id="title">Loading…</h1>
  <div class="row"><button id="prev">← Prev</button><span id="pos"></span><button id="next">Next →</button></div>
  <div id="modeui"></div>
  <div id="status"></div>
  <div class="keys" id="keys"></div>
</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let S, idx = 0, img = new Image(), view = {s: 1, ox: 0, oy: 0};
let labels = {};          // frame -> joints: {frame, view, joints:{j:[u,v]|null}} ; ids: {frame, people:[{id,bbox}]}
let cur = 0, sel = -1, drag = null, dirty = false;
const COLORS = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6','#bfef45','#fabed4','#469990','#dcbeff','#9a6324','#800000','#aaffc3','#000075'];
const color = id => COLORS[((id % COLORS.length) + COLORS.length) % COLORS.length];

async function init() {
  S = await (await fetch('/api/state')).json();
  for (const f of S.saved) labels[f.frame] = structuredClone(f);
  document.getElementById('title').textContent = S.mode === 'joints' ? 'Click the 17 joints' : 'Label person identities';
  document.getElementById('keys').innerHTML = S.mode === 'joints'
    ? 'Click = place current joint · drag a dot to move it<br><kbd>S</kbd>/<kbd>Space</kbd> not visible · <kbd>⌫</kbd> clear joint · <kbd>A</kbd> accept model guesses<br><kbd>1</kbd>–<kbd>4</kbd> view · <kbd>←</kbd>/<kbd>→</kbd> frame (auto-saves)'
    : 'Drag on empty space = new box · drag a box to move, its corner to resize<br>Select a box, then type its id · <kbd>Del</kbd> remove box<br><kbd>A</kbd> accept tracker boxes · <kbd>C</kbd> copy previous keyframe<br><kbd>←</kbd>/<kbd>→</kbd> frame (auto-saves)';
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  window.onresize = () => { fit(); draw(); };
  load();
}

const frame = () => S.frames[idx];
function entry() {
  const n = frame().frame;
  if (!labels[n]) labels[n] = S.mode === 'joints'
    ? {frame: n, view: 'front', joints: Object.fromEntries(S.joints.map(j => [j, undefined]))}
    : {frame: n, people: []};
  return labels[n];
}
const hints = () => S.hints[String(frame().frame)];

function load() {
  document.getElementById('pos').textContent = `${idx + 1} / ${S.frames.length} (frame ${frame().frame})`;
  return new Promise(resolve => {
    img = new Image();
    img.onload = () => { fit(); if (S.mode === 'joints') cur = nextPending(0); sel = -1; panel(); draw(); resolve(); };
    img.onerror = () => { document.getElementById('status').textContent = 'could not load ' + frame().file; resolve(); };
    img.src = '/img/' + frame().file;
  });
}
function fit() {
  const r = cv.getBoundingClientRect();
  cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  const s = Math.min(cv.width / img.width, cv.height / img.height);
  view = {s, ox: (cv.width - img.width * s) / 2, oy: (cv.height - img.height * s) / 2};
}
const toImg = e => { const r = cv.getBoundingClientRect();
  return [((e.clientX - r.left) * devicePixelRatio - view.ox) / view.s, ((e.clientY - r.top) * devicePixelRatio - view.oy) / view.s]; };
const toScr = (u, v) => [u * view.s + view.ox, v * view.s + view.oy];
const near = (a, b, px) => Math.hypot((a[0] - b[0]) * view.s, (a[1] - b[1]) * view.s) < px * devicePixelRatio;

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, view.ox, view.oy, img.width * view.s, img.height * view.s);
  const r = 6 * devicePixelRatio;
  ctx.font = `${12 * devicePixelRatio}px system-ui`; ctx.lineWidth = 2 * devicePixelRatio;
  if (S.mode === 'joints') {
    const e = entry(), h = hints() || {};
    S.joints.forEach((j, i) => {
      const uv = e.joints[j] ?? (e.joints[j] === undefined ? h[j] : null);
      if (!uv) return;
      const [x, y] = toScr(...uv), guess = e.joints[j] === undefined;
      ctx.fillStyle = j.startsWith('left') ? '#e33' : j.startsWith('right') ? '#36f' : '#2c2';
      ctx.globalAlpha = guess ? 0.45 : 1;
      ctx.beginPath(); ctx.arc(x, y, i === cur ? r * 1.4 : r, 0, 7); ctx.fill();
      if (i === cur) { ctx.strokeStyle = '#fff'; ctx.stroke(); }
      ctx.globalAlpha = 1;
      if (i === cur || !guess) { ctx.fillStyle = '#fff'; ctx.fillText(j, x + r * 1.6, y - r); }
    });
  } else {
    const e = entry();
    (e.people.length ? [] : (hints() || [])).forEach(p => box(p, true, false));
    e.people.forEach((p, i) => box(p, false, i === sel));
  }
}
function box(p, ghost, selected) {
  const [x, y] = toScr(p.bbox[0], p.bbox[1]);
  ctx.strokeStyle = ctx.fillStyle = color(p.id);
  ctx.globalAlpha = ghost ? 0.4 : 1;
  ctx.setLineDash(ghost ? [6, 4] : []);
  ctx.lineWidth = (selected ? 4 : 2) * devicePixelRatio;
  ctx.strokeRect(x, y, p.bbox[2] * view.s, p.bbox[3] * view.s);
  ctx.fillText((ghost ? 'tracker ' : '') + 'id ' + p.id, x + 4, y - 6);
  if (selected) ctx.fillRect(x + p.bbox[2] * view.s - 6, y + p.bbox[3] * view.s - 6, 12, 12);
  ctx.globalAlpha = 1; ctx.setLineDash([]);
}

function panel() {
  const ui = document.getElementById('modeui');
  if (S.mode === 'joints') {
    const e = entry(), h = hints() || {};
    ui.innerHTML = `<div class="row">View: ${S.views.map((v, i) => `<label><input type="radio" name="view" value="${v}" ${e.view === v ? 'checked' : ''}> ${i + 1} ${v}</label>`).join(' ')}</div>
      <ul>${S.joints.map((j, i) => { const v = e.joints[j];
        const cls = v === null ? 'skip' : v ? 'set' : h[j] ? 'hint' : '';
        const tag = v === null ? 'not visible' : v ? '✓' : h[j] ? 'guess' : '';
        return `<li data-i="${i}" class="${cls} ${i === cur ? 'cur' : ''}"><span>${j}</span><span>${tag}</span></li>`; }).join('')}</ul>
      <div>${S.frames.filter(f => labels[f.frame] && Object.values(labels[f.frame].joints).some(v => v)).length} / ${S.frames.length} frames labelled</div>`;
    ui.querySelectorAll('input[name=view]').forEach(r => r.onchange = () => { entry().view = r.value; dirty = true; });
    ui.querySelectorAll('li').forEach(li => li.onclick = () => { cur = +li.dataset.i; panel(); draw(); });
  } else {
    const e = entry();
    ui.innerHTML = `<ul>${e.people.map((p, i) => `<li data-i="${i}" class="${i === sel ? 'cur' : ''}"><span style="color:${color(p.id)}">■ id</span>
      <input type="number" min="0" value="${p.id}" data-i="${i}"></li>`).join('')}</ul>
      <div>${e.people.length} people in this frame · ${S.frames.filter(f => labels[f.frame]?.people.length).length} / ${S.frames.length} keyframes labelled</div>`;
    ui.querySelectorAll('li').forEach(li => li.onclick = ev => { if (ev.target.tagName !== 'INPUT') { sel = +li.dataset.i; panel(); draw(); } });
    ui.querySelectorAll('input').forEach(inp => inp.onchange = () => { entry().people[+inp.dataset.i].id = parseInt(inp.value, 10) || 0; dirty = true; draw(); });
  }
}
function nextPending(from) {
  const e = entry();
  for (let k = 0; k < S.joints.length; k++) { const i = (from + k) % S.joints.length; if (e.joints[S.joints[i]] === undefined) return i; }
  return Math.min(from, S.joints.length - 1);
}
const nextId = () => Math.max(-1, ...Object.values(labels).flatMap(f => (f.people || []).map(p => p.id))) + 1;

cv.onmousedown = ev => {
  if (busy) return;
  const p = toImg(ev);
  if (S.mode === 'joints') {
    const e = entry();
    const hit = S.joints.findIndex(j => e.joints[j] && near(e.joints[j], p, 9));
    if (hit >= 0) { cur = hit; drag = {joint: S.joints[hit]}; }
    else { e.joints[S.joints[cur]] = p; dirty = true; cur = nextPending(cur + 1); }
  } else {
    const e = entry();
    const i = e.people.findIndex(q => p[0] >= q.bbox[0] && p[0] <= q.bbox[0] + q.bbox[2] && p[1] >= q.bbox[1] && p[1] <= q.bbox[1] + q.bbox[3]);
    if (i >= 0) {
      sel = i; const b = e.people[i].bbox;
      const corner = near([b[0] + b[2], b[1] + b[3]], p, 12);
      drag = {kind: corner ? 'resize' : 'move', start: p, orig: [...b]};
    } else {
      e.people.push({id: nextId(), bbox: [p[0], p[1], 0, 0]}); sel = e.people.length - 1;
      drag = {kind: 'resize', start: p, orig: [p[0], p[1], 0, 0]};
    }
  }
  panel(); draw();
};
cv.onmousemove = ev => {
  if (!drag) return;
  const p = toImg(ev), e = entry(); dirty = true;
  if (S.mode === 'joints') e.joints[drag.joint] = p;
  else {
    const b = e.people[sel].bbox, o = drag.orig, dx = p[0] - drag.start[0], dy = p[1] - drag.start[1];
    if (drag.kind === 'move') { b[0] = o[0] + dx; b[1] = o[1] + dy; }
    else { b[0] = Math.min(o[0], o[0] + o[2] + dx); b[1] = Math.min(o[1], o[1] + o[3] + dy);
           b[2] = Math.abs(o[2] + dx); b[3] = Math.abs(o[3] + dy); }
  }
  draw();
};
window.onmouseup = () => {
  if (drag && S.mode === 'ids') { const e = entry(), b = e.people[sel]?.bbox;
    if (b && (b[2] < 4 || b[3] < 4)) { e.people.splice(sel, 1); sel = -1; } }
  if (drag) { drag = null; panel(); draw(); }
};

window.onkeydown = ev => {
  if (busy) { ev.preventDefault(); return; }
  if (ev.target.tagName === 'INPUT' && ev.target.type === 'number') return;
  const k = ev.key, e = entry();
  if (k === 'ArrowRight' || k === 'ArrowLeft') return go(k === 'ArrowRight' ? 1 : -1);
  if (S.mode === 'joints') {
    if (k === 's' || k === ' ') { e.joints[S.joints[cur]] = null; cur = nextPending(cur + 1); }
    else if (k === 'Backspace') e.joints[S.joints[cur]] = undefined;
    else if (k === 'a') { const h = hints() || {}; for (const j of S.joints) if (e.joints[j] === undefined && h[j]) e.joints[j] = [...h[j]]; }
    else if (k >= '1' && k <= '4') e.view = S.views[+k - 1];
    else return;
  } else {
    if ((k === 'Delete' || k === 'Backspace') && sel >= 0) { e.people.splice(sel, 1); sel = -1; }
    else if (k === 'a' && !e.people.length) e.people = structuredClone(hints() || []);
    else if (k === 'c' && idx > 0) { const prev = labels[S.frames[idx - 1].frame]; if (prev) e.people = structuredClone(prev.people); }
    else if (/^[0-9]$/.test(k) && sel >= 0) e.people[sel].id = parseInt(String(e.people[sel].id) + k, 10) % 100000;
    else return;
  }
  ev.preventDefault(); dirty = true; panel(); draw();
};

async function save() {
  if (!dirty) return true;
  const frames = Object.values(labels).map(f => S.mode === 'joints'
    ? {...f, joints: Object.fromEntries(S.joints.map(j => [j, f.joints[j] ?? null]))} : f);
  const st = document.getElementById('status');
  const r = await fetch('/api/save', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({frames})});
  const body = await r.json();
  st.className = r.ok ? '' : 'err';
  st.textContent = r.ok ? `saved ${body.saved} frames → ${body.path}` : `not saved: ${body.error}`;
  if (r.ok) dirty = false;
  return r.ok;
}
let busy = false;  // saving + switching frame; input waits until the new frame is shown
async function go(d) {
  if (busy) return;
  busy = true;
  try {
    if (!(await save())) return;
    idx = Math.max(0, Math.min(S.frames.length - 1, idx + d));
    await load();
  } finally { busy = false; }
}
window.onbeforeunload = () => dirty ? 'unsaved' : undefined;
init();
</script>
</body>
</html>
